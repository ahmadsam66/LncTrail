# .readthedocs.yaml
# Read the Docs configuration file for LncTrail
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

# Set the OS, Python version and other tools used to build the documentation.
build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  jobs:
    # Optional: fail the build if a CHANGELOG/README sanity check fails.
    # post_checkout:
    #   - python -c "print(open('README.md').readline())"

# Build documentation in the "docs/" directory with Sphinx.
sphinx:
  configuration: docs/conf.py
  # Treat Sphinx warnings as errors so broken links do not ship silently.
  fail_on_warning: true

# Optionally build your docs in additional formats such as PDF and ePub.
formats:
  - pdf
  - epub

# Install the project itself (so autodoc can import `lnctrail`) plus any
# documentation-only requirements.
python:
  install:
    - method: pip
      path: .
    - requirements: docs/requirements.txt